# SEB-Naver Planner + MPC parameters (ported from planning.yaml)

seb_naver_planner:
  ros__parameters:
    # Robot
    wheel_base: 0.315
    max_speed: 0.5
    max_steer: 0.785

    # Kinodynamic A*
    # steer_res 0.5→0.3 rad (28°→17°), 转弯路径更平滑
    # step_arc 1.5→1.0m, 路径节点更密, 转弯弧线更细腻
    step_arc: 1.0
    steer_res: 0.3
    check_num: 3
    forward_penalty: 1.0
    back_penalty: 1.5
    gear_switch_penalty: 2.0
    steer_penalty: 0.5
    steer_change_penalty: 0.3
    lambda_heu: 1.0
    max_search_time: 5.0
    map_resolution: 0.1

    # Goal tolerance (航向容差放宽: 避免到达附近反复调整)
    goal_tolerance_dist: 0.8
    goal_tolerance_yaw: 0.5    # 29°：MPC 只跟踪位置，末端朝向不应作为硬指标
    goal_tolerance_vel: 0.05
    # 重规划间隔: 0.5→1.0s (减少路径频繁变化, 转弯更稳定)
    replan_interval: 1.0

    # ---- 轨迹优化 (P2: 异步接入, 求解 0.4~2.5s 不阻塞 50Hz FSM) ----
    enable_optimization: true
    trajectory_dmin: 0.28          # 避障间距阈值 (m) = 车半宽 0.211 + 余量
    trajectory_seg_len: 0.9        # 分段弧长 (m)，越小越稳但越慢
    trajectory_max_accel: 1.0      # m/s²
    trajectory_sdf_iters: 5        # outside-in 迭代轮数
    # 优化结果有效性: 起点须在此距离内, 且不超过 optimize_valid_s 秒
    optimize_offtrack_tolerance: 2.0  # 机器人离优化轨迹超过此距离则失效
    optimize_valid_s: 8.0
    optimize_min_length: 2.0       # 路径短于此值不优化（短路径分段病态，几乎必被拒）
    traj_publish_step: 0.3         # 优化轨迹发布前的弧长重采样间距 (m)，决定 MPC 视界
    optimize_min_remaining: 0.4    # 裁掉身后点后剩余轨迹短于此值则弃用
    # A* 的碰撞检测不看车体尺寸，实测路径线段最小间距只有 0.157m（车半宽 0.211m）→
    # 车身蹭墙。按此半径膨胀障碍物后再给 A*。
    inflation_radius: 0.25
    # ---- 地形姿态 (P3, 论文 Eq.27 的 φx/φy) ----
    # 姿态由地形决定，不是速度/轨迹形状能改变的 → 等价于「路径可行性」约束:
    # 陡坡直接当障碍让 A* 绕开，轨迹再验收俯仰/横滚。
    max_slope_deg: 30.0            # 坡度超过此值不可通行（forest 有起伏，25° 会挡太多）
    max_pitch_deg: 20.0            # 轨迹验收: 俯仰上限
    max_roll_deg: 15.0             # 轨迹验收: 横滚上限（车体窄，侧翻更敏感）
    attitude_tolerance: 1.3        # 验收容差倍数（高程图有厘米级噪声）
    # ---- 可通行性风险 (P4, 论文 Eq.28 的 rmax + Eq.22 的 ρr 项) ----
    # risk 由 planner 按需计算（论文 Algorithm 1 的 numpy 版，只算轨迹点）。
    # terrain_analyzer 的全图 SE(2) 版实测 12s/次，不可实时，默认关闭。
    risk_limit: 0.8                # 超过当障碍（A* 绕开）+ 轨迹硬验收
    risk_soft_limit: 0.5           # 轨迹平均风险软阈值（近似 ρr·∫Risk²）
    # A* 全图 risk 过滤: 实测单点 ~500μs，图上数千抽样点需数秒，不可实时。
    # 规划期由坡度约束覆盖（max_slope_deg），risk 只用于轨迹验收（30 点约 15ms）。
    risk_astar_weight: -1.0        # <0 关闭 A* risk 过滤; >=0 启用

mpc_controller:
  ros__parameters:
    wheel_base: 0.315
    max_speed: 0.5
    min_speed: -0.5
    max_steer: 0.785
    N_horizon: 20
    dt: 0.05
    # 位置权重 (x,y) 高, 航向权重 Q[2] 需足够大才能平滑转弯.
    # Q[2]=0.5 太低 → MPC 几乎忽略航向误差 → 大半径弧线/过冲 → 转弯差
    # Q = [x, y, yaw] 权重。yaw 原为 2.0，远低于位置(10)，而转向变化代价
    # Rd=[5,3] 又很贵 → MPC 判定"为了消 20° 朝向误差不值得转"，实测停车时
    # 朝向误差达 24°，导致 5 个目标 0 次满足 goal_tolerance_yaw。
    Q: [10.0, 10.0, 4.0]
    R: [3.0, 3.0]
    # 转向变化率惩罚压低, 转弯更灵活 (原 10 过硬, 转弯僵直)
    Rd: [5.0, 3.0]
